name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LISP: sbcl-bin
    steps:
      - uses: actions/checkout@v4

      - uses: 40ants/setup-lisp@v4
        with:
          asdf-system: cl-bark
          qlfile-template: |
            ql :all :latest

      - name: Run test suites
        uses: 40ants/run-tests@v2
        with:
          asdf-system: cl-bark
          run-tests: |
            (asdf:load-system :cl-bark/tests)
            (asdf:load-system :cl-bark/concurrency-tests)
            ;; No reader-time 5AM: references: this form is read before fiveam is loaded.
            ;; 40ants/run-tests exits 2 when the last form returns NIL, so return OK.
            (let ((ok t))
              (dolist (suite '(("BARK-TESTS" . "BARK-TESTS")
                               ("BLOCKING-TESTS" . "BARK-BLOCKING-TESTS")
                               ("SAMPLING-CONCURRENCY-TESTS" . "BARK-CONCURRENCY-TESTS")))
                (let ((results (uiop:symbol-call :fiveam :run
                                                 (intern (car suite) (find-package (cdr suite))))))
                  (uiop:symbol-call :fiveam :explain! results)
                  (unless (uiop:symbol-call :fiveam :results-status results)
                    (setf ok nil))))
              (unless ok
                (uiop:quit 1))
              ok)
