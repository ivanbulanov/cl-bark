name: Publish API reference

# Builds the Staple API reference from the docstrings and publishes it to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packages.lisp"
      - "cl-bark.asd"
      - "docs/fix-staple.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LISP: sbcl-bin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: 40ants/setup-lisp@v4
        with:
          asdf-system: cl-bark
          qlfile-template: |
            ql :all :latest

      - name: Build API reference
        run: make docs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api
      - id: deployment
        uses: actions/deploy-pages@v4
