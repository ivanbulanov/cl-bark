name: Publish API reference

# Publishes the pre-generated Staple output in docs/api/ to GitHub Pages.
# Regenerate locally with `make docs` and commit the result; no Lisp runs here.

on:
  push:
    branches: [main]
    paths:
      - "docs/api/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api
      - id: deployment
        uses: actions/deploy-pages@v4
